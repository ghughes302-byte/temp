
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POISONY AI</title>
<style>
:root {
 --g:#00ed89;
 --bg:#050b09;
 --p:#0c1b15;
 --line:#24543d;
 --txt:#dffbea;
}
* {box-sizing:border-box}
body {
 margin:0;background:var(--bg);color:var(--txt);
 font:14px Consolas,monospace;
}
header {
 display:flex;justify-content:space-between;
 align-items:center;padding:17px 22px;
 border-bottom:1px solid var(--line);
 background:#08150f;
}
header b {color:var(--g);font-size:21px;letter-spacing:2px}
#status {color:var(--g)}
button {
 background:#123021;color:var(--g);
 border:1px solid var(--g);border-radius:7px;
 padding:10px;cursor:pointer;font:inherit;
}
button:disabled {opacity:.5;cursor:not-allowed}
input,select,textarea {
 width:100%;background:#07130e;
 border:1px solid var(--line);border-radius:7px;
 color:var(--txt);padding:10px;font:inherit;
}
label {display:block;color:#a6d4b9;margin:11px 0 5px}
small {color:#a0b9ab;line-height:1.6;display:block;margin-top:7px}
.panel {
 background:var(--p);border:1px solid var(--line);
 padding:15px;border-radius:12px;margin-bottom:15px;
}
h3 {color:var(--g);font-size:13px;letter-spacing:1px;margin:0 0 13px}
.panel button {width:100%;margin-top:10px}
.hidden {display:none!important}

/* LOGIN */
#loginScreen {
 min-height:100vh;display:flex;
 align-items:center;justify-content:center;padding:20px;
}
.login-box {
 width:100%;max-width:380px;padding:30px;
 background:var(--p);border:1px solid var(--g);
 border-radius:14px;box-shadow:0 0 35px #00ed8933;
}
.login-box h1 {
 color:var(--g);text-align:center;
 letter-spacing:3px;font-size:25px;
}
.login-box button {width:100%;margin-top:15px}
.login-message {
 color:#ff7777;text-align:center;
 margin-top:12px;min-height:20px;
}
.login-countdown {
 color:#ffb36b;text-align:center;margin-top:10px;
}

/* MAIN APP */
.layout {
 display:grid;grid-template-columns:310px minmax(0,1fr);
 height:calc(100dvh - 66px);
}
aside {overflow:auto;padding:16px;border-right:1px solid var(--line)}
main {display:flex;flex-direction:column;min-height:0;min-width:0}
.core {
 position:relative;height:120px;width:120px;
 margin:15px auto;border:3px solid var(--g);
 border-radius:50%;display:grid;place-items:center;
 box-shadow:0 0 30px #00ed8966;
 animation:pulse 3s infinite;
}
.core:before {
 content:'';position:absolute;width:91px;height:91px;
 border:2px dashed var(--g);border-radius:50%;
 animation:spin 12s linear infinite;
}
.core span {font-size:28px;font-weight:bold;color:var(--g)}
.core.busy {animation:pulse .6s infinite}
@keyframes pulse {50%{box-shadow:0 0 60px #00ed8999}}
@keyframes spin {to{transform:rotate(360deg)}}
#chat {flex:1;overflow:auto;padding:20px}
.msg {
 max-width:900px;margin:0 auto 15px;padding:15px;
 border:1px solid var(--line);border-radius:10px;
 background:#0d1b15;white-space:pre-wrap;
 overflow-wrap:anywhere;line-height:1.6;
}
.msg.user {background:#10301f}
.msg strong {display:block;color:var(--g);margin-bottom:7px}
.composer {
 display:flex;gap:8px;padding:14px;
 border-top:1px solid var(--line);
}
.composer textarea {flex:1;resize:vertical;min-width:0}
.composer button {min-width:58px}
#historyList {
 display:flex;flex-direction:column;gap:6px;
 max-height:300px;overflow:auto;
}
.history-row {display:flex;gap:5px}
.history-item {
 flex:1;min-width:0;margin:0;padding:9px;
 text-align:left;background:#07130e;color:var(--txt);
 border:1px solid transparent;font-size:12px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.history-item.active {border-color:var(--g);color:var(--g);background:#123021}
.history-delete {
 width:auto!important;flex:none;margin:0!important;
 color:#ff9b9b;border-color:#754343;background:#241313;
}
@media(max-width:750px) {
 .layout {display:flex;flex-direction:column;height:calc(100dvh - 66px)}
 aside {max-height:43%;border-right:0;border-bottom:1px solid var(--line)}
 main {flex:1;min-height:0}
 header b {font-size:16px}
 #chat {padding:10px}
 #historyList {max-height:130px}
}
</style>
</head>
<body>

<!-- SIGN IN SCREEN -->
<section id="loginScreen">
 <div class="login-box">
  <h1>POISONY AI</h1>
  <p style="text-align:center;color:#a0b9ab">POISONTECH AUTHENTICATION</p>

  <label for="loginUser">Username</label>
  <input id="loginUser" autocomplete="username" placeholder="Enter username">

  <label for="loginPass">Password</label>
  <input id="loginPass" type="password"
   autocomplete="current-password" placeholder="Enter password">

  <button id="loginButton">SIGN IN</button>

  <div id="loginMessage" class="login-message"></div>
  <div id="loginCountdown" class="login-countdown"></div>
 </div>
</section>

<!-- MAIN APPLICATION -->
<div id="app" class="hidden">
 <header>
  <b>POISONTECH // POISONY</b>
  <span id="status">● READY</span>
 </header>

 <div class="layout">
  <aside>

   <div class="panel">
    <h3>UNIVERSAL NEURAL CORE</h3>
    <div class="core" id="core"><span>PT</span></div>
    <small style="text-align:center">MULTI-PROVIDER INTELLIGENCE</small>
   </div>

   <div class="panel">
    <h3>API CONNECTION</h3>

    <label for="provider">Provider</label>
    <select id="provider">
     <option value="openai">OpenAI</option>
     <option value="gemini">Google Gemini</option>
     <option value="anthropic">Anthropic Claude</option>
     <option value="openrouter">OpenRouter</option>
     <option value="groq">Groq</option>
     <option value="ollama">Ollama</option>
     <option value="custom">Custom</option>
    </select>

    <label for="endpoint">API endpoint</label>
    <input id="endpoint">

    <label for="model">Model ID</label>
    <input id="model">

    <label for="key">API key</label>
    <input id="key" type="password" autocomplete="off"
     placeholder="Enter API key">

    <button id="test">TEST CONNECTION</button>
    <button id="save">SAVE SETTINGS</button>
    <small id="diag">Provider: not connected</small>
   </div>

   <div class="panel">
    <h3>COMMAND CENTER</h3>
    <button id="clear">＋ NEW CONVERSATION</button>
    <button id="voice">VOICE: ON</button>
    <button id="stop">STOP SPEAKING</button>
    <button id="export">EXPORT CONVERSATION</button>
    <button id="logout">SIGN OUT</button>
   </div>

   <div class="panel">
    <h3>CHAT HISTORY</h3>
    <div id="historyList"></div>
    <small>Conversations are saved in this browser.</small>
   </div>

  </aside>

  <main>
   <div id="chat" aria-live="polite"></div>

   <div class="composer">
    <button id="mic" title="Speech input">🎙</button>
    <textarea id="input" rows="2"
     placeholder="Ask Poisony anything..."></textarea>
    <button id="send">SEND</button>
   </div>
  </main>
 </div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

/* ==================================
   LOGIN SETTINGS
================================== */

// Change these credentials before using.
const LOGIN_USERNAME = "admin";
const LOGIN_PASSWORD = "CHANGE_THIS_PASSWORD";

let wrongPasswordTimer = null;
let countdownTimer = null;

function showLogin() {
 clearInterval(wrongPasswordTimer);
 clearInterval(countdownTimer);

 $('app').classList.add('hidden');
 $('loginScreen').classList.remove('hidden');

 $('loginPass').value = '';
 $('loginMessage').textContent = '';
 $('loginCountdown').textContent = '';

 $('loginUser').focus();
}

function showApp() {
 $('loginScreen').classList.add('hidden');
 $('app').classList.remove('hidden');
 renderChat();
 renderHistory();
}

function wrongPassword() {
 clearInterval(wrongPasswordTimer);
 clearInterval(countdownTimer);

 let remaining = 30;

 $('loginMessage').textContent = 'INCORRECT PASSWORD. ACCESS DENIED.';
 $('loginCountdown').textContent =
  'Returning to sign in in ' + remaining + ' seconds...';

 countdownTimer = setInterval(() => {
  remaining--;

  $('loginCountdown').textContent =
   'Returning to sign in in ' + remaining + ' seconds...';

  if (remaining <= 0) {
   clearInterval(countdownTimer);
   $('loginMessage').textContent = '';
   $('loginCountdown').textContent = '';
   $('loginPass').value = '';
   $('loginPass').focus();
  }
 }, 1000);
}

function login() {
 const username = $('loginUser').value.trim();
 const password = $('loginPass').value;

 if (username === LOGIN_USERNAME &&
     password === LOGIN_PASSWORD) {
  clearInterval(countdownTimer);
  clearInterval(wrongPasswordTimer);
  $('loginMessage').textContent = '';
  $('loginCountdown').textContent = '';
  showApp();
 } else {
  wrongPassword();
 }
}

$('loginButton').onclick = login;

$('loginPass').addEventListener('keydown', e => {
 if (e.key === 'Enter') login();
});

$('loginUser').addEventListener('keydown', e => {
 if (e.key === 'Enter') $('loginPass').focus();
});

$('logout').onclick = () => {
 if (busy) return;
 showLogin();
};

/* ==================================
   API PROVIDERS
================================== */

const presets = {
 openai: {
  endpoint:'https://api.openai.com/v1/chat/completions',
  model:'gpt-4.1-mini',format:'openai'
 },
 gemini: {
  endpoint:'https://generativelanguage.googleapis.com/v1beta/models',
  model:'gemini-2.5-flash',format:'gemini'
 },
 anthropic: {
  endpoint:'https://api.anthropic.com/v1/messages',
  model:'claude-sonnet-4-5',format:'anthropic'
 },
 openrouter: {
  endpoint:'https://openrouter.ai/api/v1/chat/completions',
  model:'openai/gpt-4.1-mini',format:'openai'
 },
 groq: {
  endpoint:'https://api.groq.com/openai/v1/chat/completions',
  model:'llama-3.3-70b-versatile',format:'openai'
 },
 ollama: {
  endpoint:'http://localhost:11434/api/chat',
  model:'llama3.2',format:'ollama'
 },
 custom: {
  endpoint:'https://your-provider.example/v1/chat/completions',
  model:'your-model-id',format:'openai'
 }
};

const SYSTEM =
`You are Poisony AI, the intelligent assistant of PoisonTech Industries.
Be knowledgeable, clear, creative, professional, and helpful.
Assist with coding, science, engineering, research, and everyday questions.
Be honest about limitations.`;

/* ==================================
   CHAT STORAGE
================================== */

let chats = [];
let activeChatId = null;
let busy = false;
let voiceOn = true;

const HISTORY_KEY = 'poisony_chat_history_v1';

function makeId() {
 return 'chat_' + Date.now().toString(36) +
  '_' + Math.random().toString(36).slice(2,8);
}

function currentChat() {
 return chats.find(c => c.id === activeChatId) || null;
}

function persistChats() {
 try {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(chats));
 } catch(e) {
  $('diag').textContent = 'Could not save chat history.';
 }
}

function cleanMessages(value) {
 if (!Array.isArray(value)) return [];

 return value.filter(x =>
  x &&
  ['user','assistant'].includes(x.role) &&
  typeof x.content === 'string'
 ).slice(-1000);
}

function createChat(showWelcome = true) {
 const chat = {
  id:makeId(),
  title:'New conversation',
  messages:[],
  createdAt:Date.now(),
  updatedAt:Date.now()
 };

 chats.unshift(chat);
 activeChatId = chat.id;

 if (showWelcome) {
  chat.messages.push({
   role:'assistant',
   content:'New conversation initialized. Poisony is ready.'
  });
 }

 persistChats();
 renderChat();
 renderHistory();

 return chat;
}

function loadHistory() {
 try {
  const stored = JSON.parse(localStorage.getItem(HISTORY_KEY));

  if (Array.isArray(stored)) {
   chats = stored.filter(c => c && typeof c.id === 'string')
    .map(c => ({
     id:c.id,
     title:c.title || 'New conversation',
     messages:cleanMessages(c.messages),
     createdAt:Number(c.createdAt) || Date.now(),
     updatedAt:Number(c.updatedAt) || Date.now()
    }));
  }
 } catch(e) {
  chats = [];
 }

 // Import old single-chat history if present.
 if (!chats.length) {
  try {
   const old = JSON.parse(
    localStorage.getItem('poisony_universal_chat')
   );

   if (Array.isArray(old) && old.length) {
    chats.push({
     id:makeId(),
     title:'Previous conversation',
     messages:cleanMessages(old),
     createdAt:Date.now(),
     updatedAt:Date.now()
    });

    persistChats();
   }
  } catch(e) {}
 }

 chats.sort((a,b) => b.updatedAt - a.updatedAt);

 if (chats.length) {
  activeChatId = chats[0].id;
 } else {
  createChat(false);
 }
}

function renderChat() {
 const area = $('chat');
 area.replaceChildren();

 const chat = currentChat();

 if (!chat) return;

 if (!chat.messages.length) {
  add('assistant','New conversation initialized. Poisony is ready.');
  return;
 }

 chat.messages.forEach(m => add(m.role,m.content));
}

function renderHistory() {
 const list = $('historyList');
 list.replaceChildren();

 chats.sort((a,b) => b.updatedAt - a.updatedAt);

 chats.forEach(chat => {
  const row = document.createElement('div');
  row.className = 'history-row';

  const open = document.createElement('button');
  open.className = 'history-item' +
   (chat.id === activeChatId ? ' active' : '');

  open.textContent = chat.title || 'New conversation';
  open.title = chat.title;
  open.onclick = () => switchChat(chat.id);

  const del = document.createElement('button');
  del.className = 'history-delete';
  del.textContent = '×';
  del.title = 'Delete conversation';
  del.onclick = () => deleteChat(chat.id);

  row.append(open,del);
  list.append(row);
 });
}

function switchChat(id) {
 if (busy) return;

 activeChatId = id;
 renderChat();
 renderHistory();
}

function deleteChat(id) {
 if (busy) return;

 const target = chats.find(c => c.id === id);
 if (!target) return;

 if (!confirm('Delete this conversation?')) return;

 chats = chats.filter(c => c.id !== id);

 if (activeChatId === id) {
  activeChatId = null;
 }

 if (!activeChatId) {
  createChat(false);
 } else {
  persistChats();
  renderChat();
  renderHistory();
 }
}

function saveCurrentChat() {
 const chat = currentChat();
 if (!chat) return;

 chat.updatedAt = Date.now();

 const firstUser = chat.messages.find(m => m.role === 'user');

 if (firstUser && chat.title === 'New conversation') {
  chat.title = firstUser.content
   .replace(/\s+/g,' ')
   .trim()
   .slice(0,42);

  if (firstUser.content.length > 42) {
   chat.title += '…';
  }
 }

 persistChats();
 renderHistory();
}

function add(role,text) {
 const el = document.createElement('div');
 el.className = 'msg ' + role;

 const heading = document.createElement('strong');
 heading.textContent = role === 'user' ? 'YOU' : 'POISONY';

 const content = document.createElement('div');
 content.textContent = text;

 el.append(heading,content);
 $('chat').append(el);
 $('chat').scrollTop = $('chat').scrollHeight;

 return content;
}

/* ==================================
   API SETTINGS
================================== */

function configure() {
 const p = presets[$('provider').value];

 $('endpoint').value = p.endpoint;
 $('model').value = p.model;

 $('diag').textContent =
  'Provider: ' + $('provider').value + ' | Awaiting test';
}

$('provider').onchange = configure;

try {
 const cfg = JSON.parse(localStorage.getItem('poisony_api_cfg'));

 if (cfg && presets[cfg.provider]) {
  $('provider').value = cfg.provider;
  $('endpoint').value = cfg.endpoint || presets[cfg.provider].endpoint;
  $('model').value = cfg.model || presets[cfg.provider].model;
  $('key').value = cfg.key || '';
 } else {
  configure();
 }
} catch(e) {
 configure();
}

$('save').onclick = () => {
 try {
  localStorage.setItem('poisony_api_cfg', JSON.stringify({
   provider:$('provider').value,
   endpoint:$('endpoint').value.trim(),
   model:$('model').value.trim(),
   key:$('key').value.trim()
  }));

  $('diag').textContent = 'Settings saved.';
 } catch(e) {
  $('diag').textContent = 'Failed to save settings.';
 }
};

/* ==================================
   API REQUESTS
================================== */

function apiError(response,data) {
 return new Error(
  data?.error?.message ||
  data?.message ||
  'HTTP ' + response.status
 );
}

async function request(conversation) {
 const provider = $('provider').value;
 const p = presets[provider];
 const key = $('key').value.trim();
 const model = $('model').value.trim();
 const endpoint = $('endpoint').value.trim();

 if (!model || !endpoint) {
  throw Error('Model and endpoint are required.');
 }

 if (provider !== 'ollama' && !key) {
  throw Error('Enter an API key.');
 }

 let url = endpoint;
 let headers = {'Content-Type':'application/json'};
 let body;

 if (p.format === 'openai') {
  headers.Authorization = 'Bearer ' + key;

  body = {
   model,
   messages:[
    {role:'system',content:SYSTEM},
    ...conversation
   ],
   max_tokens:1024
  };
 }

 else if (p.format === 'gemini') {
  url = endpoint.replace(/\/$/,'') +
   '/' + encodeURIComponent(model) + ':generateContent';

  headers['x-goog-api-key'] = key;

  body = {
   systemInstruction:{parts:[{text:SYSTEM}]},
   contents:conversation.map(x => ({
    role:x.role === 'assistant' ? 'model' : 'user',
    parts:[{text:x.content}]
   })),
   generationConfig:{maxOutputTokens:2048}
  };
 }

 else if (p.format === 'anthropic') {
  headers['x-api-key'] = key;
  headers['anthropic-version'] = '2023-06-01';
  headers['anthropic-dangerous-direct-browser-access'] = 'true';

  body = {
   model,
   system:SYSTEM,
   messages:conversation,
   max_tokens:1024
  };
 }

 else if (p.format === 'ollama') {
  body = {
   model,
   stream:false,
   messages:[
    {role:'system',content:SYSTEM},
    ...conversation
   ]
  };
 }

 const controller = new AbortController();
 const timeout = setTimeout(() => controller.abort(),90000);

 try {
  const response = await fetch(url,{
   method:'POST',
   headers,
   body:JSON.stringify(body),
   signal:controller.signal
  });

  let data;

  try {
   data = await response.json();
  } catch(e) {
   throw Error('Server returned non-JSON data.');
  }

  if (!response.ok) throw apiError(response,data);

  let text = '';

  if (p.format === 'openai') {
   text = data.choices?.[0]?.message?.content;
  }

  else if (p.format === 'gemini') {
   text = data.candidates?.[0]?.content?.parts
    ?.map(x => x.text || '').join('\n');
  }

  else if (p.format === 'anthropic') {
   text = data.content
    ?.filter(x => x.type === 'text')
    .map(x => x.text).join('\n');
  }

  else {
   text = data.message?.content;
  }

  if (typeof text !== 'string' || !text.trim()) {
   throw Error('Provider returned no text.');
  }

  return text.trim();

 } catch(err) {
  if (err.name === 'AbortError') {
   throw Error('Request timed out.');
  }

  if (err instanceof TypeError) {
   throw Error('Network or CORS failure.');
  }

  throw err;

 } finally {
  clearTimeout(timeout);
 }
}

/* ==================================
   CHAT FUNCTIONS
================================== */

function setBusy(v) {
 busy = v;

 $('send').disabled = v;
 $('test').disabled = v;
 $('clear').disabled = v;

 $('core').classList.toggle('busy',v);

 $('status').textContent =
  v ? '● PROCESSING' : '● READY';
}

function speak(text) {
 if (!voiceOn || !('speechSynthesis' in window)) return;

 speechSynthesis.cancel();

 const utterance = new SpeechSynthesisUtterance(text);
 utterance.pitch = .85;
 utterance.rate = 1;

 speechSynthesis.speak(utterance);
}

async function send() {
 const text = $('input').value.trim();

 if (!text || busy) return;

 if (!currentChat()) createChat(false);

 const chat = currentChat();

 $('input').value = '';

 chat.messages.push({role:'user',content:text});
 add('user',text);
 saveCurrentChat();

 const conversation = chat.messages.slice(-24);
 const output = add('assistant','Processing...');

 setBusy(true);

 try {
  const reply = await request(conversation);

  output.textContent = reply;

  chat.messages.push({
   role:'assistant',
   content:reply
  });

  saveCurrentChat();

  $('diag').textContent =
   'Connected: ' + $('provider').value +
   ' / ' + $('model').value;

  speak(reply);

 } catch(err) {
  output.textContent =
   'CONNECTION ERROR: ' + err.message +
   '\nYour message remains saved in this conversation.';

  $('diag').textContent = 'Connection failed';

 } finally {
  setBusy(false);
 }
}

$('send').onclick = send;

$('input').addEventListener('keydown',e => {
 if (e.key === 'Enter' && !e.shiftKey) {
  e.preventDefault();
  send();
 }
});

$('clear').onclick = () => {
 if (busy) return;
 createChat(true);
};

/* ==================================
   CONNECTION TEST
================================== */

$('test').onclick = async () => {
 if (busy) return;

 setBusy(true);

 try {
  const reply = await request([
   {role:'user',content:'Reply briefly: POISONY SYSTEM ONLINE'}
  ]);

  add('assistant','CONNECTION TEST SUCCESSFUL\n' + reply);

  $('diag').textContent = 'Connected.';

 } catch(err) {
  add('assistant','CONNECTION TEST FAILED: ' + err.message);
  $('diag').textContent = 'Connection failed';

 } finally {
  setBusy(false);
 }
};

/* ==================================
   VOICE
================================== */

$('voice').onclick = () => {
 voiceOn = !voiceOn;

 $('voice').textContent = 'VOICE: ' +
  (voiceOn ? 'ON' : 'OFF');

 if (!voiceOn && 'speechSynthesis' in window) {
  speechSynthesis.cancel();
 }
};

$('stop').onclick = () => {
 if ('speechSynthesis' in window) {
  speechSynthesis.cancel();
 }
};

const Recognition =
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;

if (Recognition) {
 const r = new Recognition();
 r.lang = 'en-US';

 r.onresult = e => {
  $('input').value = e.results[0][0].transcript;
 };

 r.onerror = e => {
  $('status').textContent = '● MICROPHONE: ' + e.error;
 };

 $('mic').onclick = () => {
  try {r.start()} catch(e) {}
 };
} else {
 $('mic').disabled = true;
}

/* ==================================
   EXPORT
================================== */

$('export').onclick = () => {
 const chat = currentChat();

 if (!chat) return;

 const blob = new Blob(
  [JSON.stringify(chat.messages,null,2)],
  {type:'application/json'}
 );

 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');

 a.href = url;
 a.download = 'Poisony_Conversation.json';
 a.click();

 setTimeout(() => URL.revokeObjectURL(url),1000);
};

/* ==================================
   STARTUP
================================== */

loadHistory();

</script>
</body>
</html>
